<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register · Lost & Found Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background-image: url(WhatsApp\ Image\ 2026-07-02\ at\ 3.31.44\ PM.jpeg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .register-wrapper {
            max-width: 720px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.70);
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(12, 68, 124, 0.08);
            padding: 2rem 2.5rem 2rem;
        }

        .form-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.6rem;
        }

        .logo-wrapper .logo-img {
            max-height: 110px;
            width: 110px;
            height: 110px;
            display: block;
            border-radius: 50%;
            object-fit: cover;
            background: transparent;
            box-shadow: 0 6px 20px rgba(24, 95, 165, 0.18);
            transition: transform 0.2s;
            border: none;
        }

        .logo-wrapper .logo-img:hover {
            transform: scale(1.05);
        }

        .form-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0d9488;
        }
        .form-header p {
            color: #5F5E5A;
            font-size: 0.8rem;
            margin-top: 0.1rem;
        }

        .register-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem 1.2rem;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .input-group label {
            font-size: 0.78rem;
            font-weight: 600;
            color: #2C2C2A;
        }

        .input-field {
            position: relative;
            display: flex;
            align-items: center;
            background: #F1EFE8;
            border: 1.5px solid #B5D4F4;
            border-radius: 60px;
            padding: 0 1rem;
            transition: 0.2s;
            min-height: 38px;
        }
        .input-field:focus-within {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.10);
            background: white;
        }
        .input-field i {
            color: #5F5E5A;
            font-size: 0.8rem;
            margin-right: 0.5rem;
            width: 1rem;
            text-align: center;
            flex-shrink: 0;
        }
        .input-field input {
            border: none;
            background: transparent;
            padding: 0.5rem 0;
            width: 100%;
            font-size: 0.88rem;
            outline: none;
            color: #2C2C2A;
        }
        .input-field input::placeholder {
            color: #afafa2;
            font-size: 0.82rem;
        }
        .input-field .field-icon-right {
            position: absolute;
            right: 1rem;
            color: #5F5E5A;
            font-size: 0.8rem;
        }
        .input-field .toggle-pw {
            cursor: pointer;
            color: #5F5E5A;
            font-size: 0.8rem;
            padding: 0.2rem;
            transition: color 0.2s;
        }
        .input-field .toggle-pw:hover {
            color: #0d9488;
        }

        .input-field.error {
            border-color: #E24B4A;
            background: #fff6f5;
        }
        .input-field.success {
            border-color: #1D9E75;
            background: #f0faf6;
        }

        .error-message {
            color: #E24B4A;
            font-size: 0.65rem;
            padding-left: 1rem;
            min-height: 0.8rem;
            margin-top: 0.05rem;
        }
        .success-message {
            color: #1D9E75;
            font-size: 0.65rem;
            padding-left: 1rem;
            min-height: 0.8rem;
            margin-top: 0.05rem;
        }

        .strength-container {
            margin-top: 0.05rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .strength-bar {
            flex: 1;
            height: 4px;
            background: #E2E8F0;
            border-radius: 4px;
            overflow: hidden;
        }
        .strength-bar .fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s, background 0.3s;
        }
        .strength-text {
            font-size: 0.65rem;
            font-weight: 600;
            min-width: 40px;
            color: #5F5E5A;
            text-align: right;
        }
        .strength-text.weak { color: #E24B4A; }
        .strength-text.fair { color: #EF9F27; }
        .strength-text.strong { color: #1D9E75; }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.2rem 0;
        }
        .checkbox-group input[type="checkbox"] {
            accent-color: #0d9488;
            width: 0.9rem;
            height: 0.9rem;
            margin-top: 0.15rem;
            flex-shrink: 0;
            cursor: pointer;
        }
        .checkbox-group label {
            font-size: 0.78rem;
            color: #2C2C2A;
            cursor: pointer;
        }
        .checkbox-group label a {
            color: #0d9488;
            text-decoration: none;
            font-weight: 500;
        }
        .checkbox-group label a:hover {
            text-decoration: underline;
        }

        .btn-register {
            background: #0d9488;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 0.6rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: not-allowed;
            transition: background 0.2s, transform 0.1s;
            height: 40px;
            margin-top: 0.1rem;
            opacity: 0.5;
        }
        .btn-register.active {
            background: #0d9488;
            cursor: pointer;
            opacity: 1;
        }
        .btn-register.active:hover {
            background: #0a7a70;
            transform: translateY(-1px);
        }
        .btn-register .spinner {
            display: none;
            width: 0.95rem;
            height: 0.95rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .btn-register.loading .spinner {
            display: inline-block;
        }
        .btn-register.loading .btn-text {
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: #5F5E5A;
            font-size: 0.7rem;
            margin: 0.1rem 0;
        }
        .divider hr {
            flex: 1;
            border: none;
            border-top: 1px solid rgba(181, 212, 244, 0.4);
        }

        .login-cta {
            text-align: center;
            font-size: 0.82rem;
            color: #2C2C2A;
        }
        .login-cta a {
            color: #0d9488;
            font-weight: 600;
            text-decoration: none;
        }
        .login-cta a:hover {
            text-decoration: underline;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
        }

        .toast {
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            animation: slideInRight 0.4s ease;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.success { background: #0d9488; }
        .toast.error { background: #E24B4A; }
        .toast.info { background: #3B82F6; }

        .toast .toast-close {
            margin-left: auto;
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0.8;
            background: none;
            border: none;
            color: white;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideOutRight {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100px); }
        }

        .toast.hiding {
            animation: slideOutRight 0.3s ease forwards;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: white;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            border-radius: 16px;
            padding: 2rem;
            overflow-y: auto;
            position: relative;
        }
        .modal-content .close-modal {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            font-size: 1.2rem;
            color: #5F5E5A;
            cursor: pointer;
            background: none;
            border: none;
        }
        .modal-content h4 {
            font-size: 1.1rem;
            color: #0C447C;
            margin-bottom: 0.8rem;
        }
        .modal-content p {
            font-size: 0.85rem;
            color: #2C2C2A;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .register-wrapper {
                padding: 1.5rem 1.2rem 1.5rem;
                border-radius: 16px;
            }
            .register-form {
                grid-template-columns: 1fr;
                gap: 0.6rem;
            }
            .form-header h2 {
                font-size: 1.1rem;
            }
            .logo-wrapper .logo-img {
                width: 90px;
                height: 90px;
                max-height: 90px;
            }
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="register-wrapper">
        <div class="form-header">
            <div class="logo-wrapper">
                <img src="cropped_circle_image.png" alt="Lost & Found Logo" class="logo-img" />
            </div>
            <h2 style="color: #0d9488;">Create account</h2>
            <p>Join the community and recover your belongings</p>
        </div>

        <form class="register-form" id="registerForm" novalidate>
            <div class="input-group">
                <label for="fullName">Full Name</label>
                <div class="input-field" id="nameField">
                    <i class="fas fa-user"></i>
                    <input type="text" id="fullName" placeholder="First and last name" required />
                </div>
                <div class="error-message" id="nameError"></div>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-field" id="emailField">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter your email" required />
                    <span class="field-icon-right" id="emailCheckIcon"></span>
                </div>
                <div class="error-message" id="emailError"></div>
                <div class="success-message" id="emailSuccess"></div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-field" id="passwordField">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Create a password" required />
                    <span class="toggle-pw" id="togglePw">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="strength-container">
                    <div class="strength-bar"><div class="fill" id="strengthFill"></div></div>
                    <span class="strength-text" id="strengthText">Weak</span>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-field" id="confirmField">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
                    <span class="field-icon-right" id="confirmIcon"></span>
                </div>
                <div class="error-message" id="confirmError"></div>
            </div>

            <!-- ✅ ROLE DROPDOWN REMOVED - Role is automatically set to "Student" -->

            <div class="full-width checkbox-group">
                <input type="checkbox" id="termsCheck" required />
                <label for="termsCheck">
                    I agree to the <a href="#" id="termsLink">Terms of Service</a> and
                    <a href="#" id="privacyLink">Privacy Policy</a>
                </label>
            </div>
            <div class="full-width error-message" id="termsError"></div>

            <button type="submit" class="full-width btn-register" id="registerBtn" disabled>
                <span class="btn-text">Create account <i class="fas fa-arrow-right"></i></span>
                <span class="spinner"></span>
            </button>

            <div class="full-width divider">
                <hr /><span>or</span><hr />
            </div>

            <div class="full-width login-cta">
                Already have an account? <a href="login.html">Log in</a>
            </div>
        </form>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-modal" id="closeModal">&times;</button>
            <h4 id="modalTitle">Terms of Service</h4>
            <p id="modalBody"></p>
        </div>
    </div>

    <script>
    // ============================================================
    // ✅ SIMPLE REGISTER SCRIPT - DIRECT API CALL
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        
const API_URL = 'http://localhost/lostandfoundt/backend/api/register.php';        
        const form = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const toastContainer = document.getElementById('toastContainer');
        
        // ============================================================
        // ✅ TOAST FUNCTION
        // ============================================================
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${message}</span>
                <button class="toast-close">&times;</button>
            `;
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
            
            toast.querySelector('.toast-close').addEventListener('click', function() {
                toast.classList.add('hiding');
                setTimeout(() => toast.remove(), 300);
            });
        }
        
        // ============================================================
        // ✅ FORM SUBMIT
        // ============================================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Get data
            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // ✅ ROLE IS NOW ALWAYS "Student" - NOT from dropdown!
            const role = 'Student';
            
            console.log('📝 Form Data:', { name, email, password, role });
            
            // Validation
            if (!name || name.length < 2) {
                showToast('Name must be at least 2 characters', 'error');
                return;
            }
            
            if (!email || !email.includes('@')) {
                showToast('Please enter a valid email', 'error');
                return;
            }
            
            if (!password || password.length < 6) {
                showToast('Password must be at least 6 characters', 'error');
                return;
            }
            
            if (password !== document.getElementById('confirmPassword').value) {
                showToast('Passwords do not match', 'error');
                return;
            }
            
            if (!document.getElementById('termsCheck').checked) {
                showToast('Please accept Terms and Privacy Policy', 'error');
                return;
            }
            
            // Show loading
            registerBtn.classList.add('loading');
            registerBtn.disabled = true;
            
            try {
                // ✅ DIRECT API CALL with role = 'Student'
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password,
                        role: role // ✅ Always 'Student'
                    })
                });
                
                console.log('📥 Response Status:', response.status);
                
                const text = await response.text();
                console.log('📥 Raw Response:', text);
                
                let data;
                try {
                    data = JSON.parse(text);
                } catch(e) {
                    console.error('JSON Parse Error:', e);
                    showToast('Server error: Invalid response', 'error');
                    registerBtn.classList.remove('loading');
                    registerBtn.disabled = false;
                    return;
                }
                
                if (data.success) {
                    showToast('✅ ' + data.message, 'success');
                    
                    // Reset form
                    form.reset();
                    document.getElementById('strengthFill').style.width = '0%';
                    document.getElementById('strengthText').textContent = '';
                    document.getElementById('emailCheckIcon').textContent = '';
                    document.getElementById('confirmIcon').textContent = '';
                    
                    registerBtn.classList.remove('active');
                    registerBtn.disabled = true;
                    
                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                    
                } else {
                    showToast('❌ ' + data.message, 'error');
                }
                
            } catch(error) {
                console.error('❌ Network Error:', error);
                showToast('❌ Network Error: ' + error.message, 'error');
            }
            
            registerBtn.classList.remove('loading');
            registerBtn.disabled = false;
        });
        
        // ============================================================
        // ✅ ENABLE BUTTON WHEN FORM IS VALID
        // ============================================================
        function checkFormValidity() {
            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('termsCheck').checked;
            
            // ✅ Role is always "Student" - no need to check dropdown
            
            const valid = name.length >= 2 && 
                         email.includes('@') && 
                         password.length >= 6 && 
                         password === confirm && 
                         terms;
            
            if (valid) {
                registerBtn.classList.add('active');
                registerBtn.disabled = false;
            } else {
                registerBtn.classList.remove('active');
                registerBtn.disabled = true;
            }
        }
        
        // Add event listeners for validation
        ['fullName', 'email', 'password', 'confirmPassword', 'termsCheck'].forEach(id => {
            document.getElementById(id).addEventListener('input', checkFormValidity);
            document.getElementById(id).addEventListener('change', checkFormValidity);
        });
        
        // ============================================================
        // ✅ PASSWORD TOGGLE
        // ============================================================
        document.getElementById('togglePw').addEventListener('click', function() {
            const pw = document.getElementById('password');
            const type = pw.type === 'password' ? 'text' : 'password';
            pw.type = type;
            this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });
        
        // ============================================================
        // ✅ PASSWORD STRENGTH
        // ============================================================
        document.getElementById('password').addEventListener('input', function() {
            const val = this.value;
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
            if (/\d/.test(val)) score++;
            if (/[^a-zA-Z0-9]/.test(val)) score++;
            
            if (val.length === 0) {
                fill.style.width = '0%';
                text.textContent = '';
                return;
            }
            
            if (score <= 2) {
                fill.style.width = '33%';
                fill.style.background = '#E24B4A';
                text.textContent = 'Weak';
                text.className = 'strength-text weak';
            } else if (score <= 3) {
                fill.style.width = '66%';
                fill.style.background = '#EF9F27';
                text.textContent = 'Fair';
                text.className = 'strength-text fair';
            } else {
                fill.style.width = '100%';
                fill.style.background = '#1D9E75';
                text.textContent = 'Strong';
                text.className = 'strength-text strong';
            }
        });
        
        // ============================================================
        // ✅ CONFIRM PASSWORD MATCH
        // ============================================================
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const pw = document.getElementById('password').value;
            const confirm = this.value;
            const icon = document.getElementById('confirmIcon');
            
            if (confirm.length === 0) {
                icon.textContent = '';
                return;
            }
            
            if (pw === confirm) {
                icon.innerHTML = '<i class="fas fa-check" style="color:#1D9E75;"></i>';
            } else {
                icon.innerHTML = '<i class="fas fa-times" style="color:#E24B4A;"></i>';
            }
        });
        
        // ============================================================
        // ✅ EMAIL CHECK
        // ============================================================
        let emailTimeout;
        document.getElementById('email').addEventListener('input', function() {
            const email = this.value.trim();
            const icon = document.getElementById('emailCheckIcon');
            
            if (!email || !email.includes('@')) {
                icon.textContent = '';
                return;
            }
            
            icon.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            
            clearTimeout(emailTimeout);
            emailTimeout = setTimeout(async function() {
                try {
                    const response = await fetch('http://localhost/lostandfoundt/backend/api/check-email.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email })
                    });
                    const data = await response.json();
                    
                    if (data.exists) {
                        icon.innerHTML = '<i class="fas fa-times" style="color:#E24B4A;"></i>';
                        document.getElementById('emailError').textContent = 'Email already registered';
                        document.getElementById('emailField').classList.add('error');
                    } else {
                        icon.innerHTML = '<i class="fas fa-check" style="color:#1D9E75;"></i>';
                        document.getElementById('emailError').textContent = '';
                        document.getElementById('emailField').classList.remove('error');
                        document.getElementById('emailSuccess').textContent = 'Email available';
                    }
                    checkFormValidity();
                } catch(e) {
                    console.warn('Email check failed:', e);
                    icon.innerHTML = '<i class="fas fa-check" style="color:#1D9E75;"></i>';
                }
            }, 500);
        });
        
        // ============================================================
        // ✅ MODAL
        // ============================================================
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const closeModal = document.getElementById('closeModal');
        
        document.getElementById('termsLink').addEventListener('click', function(e) {
            e.preventDefault();
            modalTitle.textContent = 'Terms of Service';
            modalBody.innerHTML = `
                <strong>1. Acceptance of Terms</strong><br>
                By creating an account, you agree to comply with these terms.<br><br>
                <strong>2. User Responsibilities</strong><br>
                You are responsible for the accuracy of your reports and claims.<br><br>
                <strong>3. Prohibited Activities</strong><br>
                Do not post false claims or spam.<br><br>
                <strong>4. Termination</strong><br>
                We reserve the right to suspend accounts that violate these terms.
            `;
            modalOverlay.classList.add('active');
        });
        
        document.getElementById('privacyLink').addEventListener('click', function(e) {
            e.preventDefault();
            modalTitle.textContent = 'Privacy Policy';
