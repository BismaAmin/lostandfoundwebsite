<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password · Lost & Found Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background-image: url(WhatsApp\ Image\ 2026-07-02\ at\ 3.31.44\ PM.jpeg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .reset-wrapper {
            max-width: 420px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.70);
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(12, 68, 124, 0.08);
            padding: 2rem 2rem 1.8rem;
        }

        .form-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.6rem;
        }

        .logo-wrapper .logo-img {
            max-height: 100px;
            width: 100px;
            height: 100px;
            display: block;
            border-radius: 50%;
            object-fit: cover;
            background: transparent;
            box-shadow: 0 6px 20px rgba(24, 95, 165, 0.18);
            transition: transform 0.2s;
            border: none;
        }

        .form-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0C447C;
        }

        .form-header p {
            color: #5F5E5A;
            font-size: 0.82rem;
            margin-top: 0.1rem;
        }

        .reset-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .input-group label {
            font-size: 0.78rem;
            font-weight: 600;
            color: #2C2C2A;
        }

        .input-field {
            display: flex;
            align-items: center;
            background: #F1EFE8;
            border: 1.5px solid #B5D4F4;
            border-radius: 60px;
            padding: 0 1rem;
            transition: 0.2s;
            min-height: 42px;
        }

        .input-field:focus-within {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.10);
            background: white;
        }

        .input-field i {
            color: #5F5E5A;
            font-size: 0.85rem;
            margin-right: 0.6rem;
            width: 1rem;
            text-align: center;
            flex-shrink: 0;
        }

        .input-field input {
            border: none;
            background: transparent;
            padding: 0.6rem 0;
            width: 100%;
            font-size: 0.9rem;
            outline: none;
            color: #2C2C2A;
        }

        .input-field input::placeholder {
            color: #afafa2;
            font-size: 0.82rem;
        }

        .input-field .toggle-pw {
            cursor: pointer;
            color: #5F5E5A;
            font-size: 0.8rem;
            padding: 0.2rem;
            transition: color 0.2s;
        }

        .input-field .toggle-pw:hover {
            color: #0d9488;
        }

        .input-field.error {
            border-color: #E24B4A;
            background: #fff6f5;
        }

        .input-field.success {
            border-color: #1D9E75;
            background: #f0faf6;
        }

        .error-message {
            color: #E24B4A;
            font-size: 0.7rem;
            padding-left: 1rem;
            min-height: 0.9rem;
        }

        .success-message {
            color: #1D9E75;
            font-size: 0.85rem;
            text-align: center;
            padding: 12px;
            background: #e6f7f5;
            border-radius: 8px;
        }

        .btn-reset {
            background: #0d9488;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 0.7rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.2rem;
        }

        .btn-reset:hover {
            background: #0a7a70;
        }

        .btn-reset:disabled {
            background: #B5D4F4;
            cursor: not-allowed;
        }

        .btn-reset .spinner {
            display: none;
            width: 0.95rem;
            height: 0.95rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-reset.loading .spinner {
            display: inline-block;
        }

        .btn-reset.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .strength-container {
            margin-top: 0.05rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            background: #E2E8F0;
            border-radius: 4px;
            overflow: hidden;
        }

        .strength-bar .fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: width 0.3s, background 0.3s;
        }

        .strength-text {
            font-size: 0.65rem;
            font-weight: 600;
            min-width: 40px;
            color: #5F5E5A;
            text-align: right;
        }

        .strength-text.weak { color: #E24B4A; }
        .strength-text.fair { color: #EF9F27; }
        .strength-text.strong { color: #1D9E75; }

        .bottom-back {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(181, 212, 244, 0.4);
            text-align: center;
        }

        .bottom-back .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #5F5E5A;
            font-size: 0.82rem;
            font-weight: 500;
            text-decoration: none;
            padding: 0.3rem 0.8rem;
            border-radius: 60px;
            transition: all 0.2s;
        }

        .bottom-back .back-link:hover {
            color: #0d9488;
            background: rgba(13, 148, 136, 0.08);
        }

        .bottom-back .back-link i {
            font-size: 0.7rem;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
        }

        .toast {
            padding: 16px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            animation: slideInRight 0.4s ease;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.success { background: #0d9488; }
        .toast.error { background: #E24B4A; }
        .toast.info { background: #3B82F6; }

        .toast .toast-close {
            margin-left: auto;
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0.8;
            background: none;
            border: none;
            color: white;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideOutRight {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100px); }
        }

        .toast.hiding {
            animation: slideOutRight 0.3s ease forwards;
        }

        @media (max-width: 480px) {
            .reset-wrapper {
                padding: 1.5rem 1.2rem 1.5rem;
                border-radius: 18px;
            }

            .logo-wrapper .logo-img {
                width: 80px;
                height: 80px;
                max-height: 80px;
            }

            .form-header h3 {
                font-size: 1rem;
            }

            .input-field {
                min-height: 38px;
            }

            .input-field input {
                font-size: 0.85rem;
                padding: 0.5rem 0;
            }

            .btn-reset {
                height: 40px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="reset-wrapper">
        <div class="form-header">
            <div class="logo-wrapper">
                <img src="cropped_circle_image.png" alt="Lost & Found Logo" class="logo-img" />
            </div>
            <h3>Reset Password</h3>
            <p id="userGreeting">Enter your new password below</p>
        </div>

        <form class="reset-form" id="resetForm" novalidate>
            <div class="input-group">
                <label for="newPassword">New Password</label>
                <div class="input-field" id="passwordField">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="newPassword" placeholder="Enter new password" required />
                    <span class="toggle-pw" id="togglePw"><i class="fas fa-eye"></i></span>
                </div>
                <div class="strength-container">
                    <div class="strength-bar"><div class="fill" id="strengthFill"></div></div>
                    <span class="strength-text" id="strengthText">Weak</span>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-field" id="confirmField">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
                </div>
                <div class="error-message" id="confirmError"></div>
            </div>

            <div id="messageContainer"></div>

            <button type="submit" class="btn-reset" id="resetBtn">
                <span class="btn-text">Reset Password <i class="fas fa-arrow-right"></i></span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="bottom-back">
            <a href="login.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to login
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ============================================================
            // ✅ GET TOKEN FROM URL
            // ============================================================
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            const API_URL = 'http://localhost/lostandfoundt/backend/api/reset-password.php';
            const VALIDATE_URL = 'http://localhost/lostandfoundt/backend/api/validate-token.php';

            const form = document.getElementById('resetForm');
            const passwordInput = document.getElementById('newPassword');
            const confirmInput = document.getElementById('confirmPassword');
            const resetBtn = document.getElementById('resetBtn');
            const toastContainer = document.getElementById('toastContainer');
            const messageContainer = document.getElementById('messageContainer');
            const userGreeting = document.getElementById('userGreeting');

            // ============================================================
            // ✅ TOAST FUNCTION
            // ============================================================
            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                    <span>${message}</span>
                    <button class="toast-close">&times;</button>
                `;
                toastContainer.appendChild(toast);

                setTimeout(() => {
                    toast.classList.add('hiding');
                    setTimeout(() => toast.remove(), 300);
                }, 5000);

                toast.querySelector('.toast-close').addEventListener('click', function() {
                    toast.classList.add('hiding');
                    setTimeout(() => toast.remove(), 300);
                });
            }

            // ============================================================
            // ✅ VALIDATE TOKEN ON PAGE LOAD
            // ============================================================
            if (!token) {
                userGreeting.textContent = '❌ No reset token provided';
                resetBtn.disabled = true;
                showToast('Invalid reset link. Please request a new one.', 'error');
                return;
            }

            async function validateToken() {
                try {
                    const response = await fetch(VALIDATE_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token: token })
                    });

                    const data = await response.json();

                    if (data.success) {
                        userGreeting.textContent = `Hi ${data.user.name}, enter your new password`;
                        showToast('✅ Token validated!', 'success');
                    } else {
                        userGreeting.textContent = '❌ Invalid or expired token';
                        resetBtn.disabled = true;
                        showToast('This reset link is invalid or expired. Please request a new one.', 'error');
                    }
                } catch (error) {
                    showToast('Error validating token: ' + error.message, 'error');
                }
            }

            validateToken();

            // ============================================================
            // ✅ PASSWORD TOGGLE
            // ============================================================
            document.getElementById('togglePw').addEventListener('click', function() {
                const pw = document.getElementById('newPassword');
                const type = pw.type === 'password' ? 'text' : 'password';
                pw.type = type;
                this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
            });

            // ============================================================
            // ✅ PASSWORD STRENGTH
            // ============================================================
            passwordInput.addEventListener('input', function() {
                const val = this.value;
                const fill = document.getElementById('strengthFill');
                const text = document.getElementById('strengthText');

                let score = 0;
                if (val.length >= 6) score++;
                if (val.length >= 10) score++;
                if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
                if (/\d/.test(val)) score++;
                if (/[^a-zA-Z0-9]/.test(val)) score++;

                if (val.length === 0) {
                    fill.style.width = '0%';
                    text.textContent = '';
                    return;
                }

                if (score <= 2) {
                    fill.style.width = '33%';
                    fill.style.background = '#E24B4A';
                    text.textContent = 'Weak';
                    text.className = 'strength-text weak';
                } else if (score <= 3) {
                    fill.style.width = '66%';
                    fill.style.background = '#EF9F27';
                    text.textContent = 'Fair';
                    text.className = 'strength-text fair';
                } else {
                    fill.style.width = '100%';
                    fill.style.background = '#1D9E75';
                    text.textContent = 'Strong';
                    text.className = 'strength-text strong';
                }
            });

            // ============================================================
            // ✅ CONFIRM PASSWORD MATCH
            // ============================================================
            confirmInput.addEventListener('input', function() {
                const pw = passwordInput.value;
                const confirm = this.value;
                const error = document.getElementById('confirmError');

                if (confirm.length === 0) {
                    error.textContent = '';
                    return;
                }

                if (pw === confirm) {
                    error.textContent = '';
                    document.getElementById('confirmField').classList.remove('error');
                    document.getElementById('confirmField').classList.add('success');
                } else {
                    error.textContent = 'Passwords do not match';
                    document.getElementById('confirmField').classList.remove('success');
                    document.getElementById('confirmField').classList.add('error');
                }
            });

            // ============================================================
            // ✅ FORM SUBMIT
            // ============================================================
            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const newPassword = passwordInput.value.trim();
                const confirmPassword = confirmInput.value.trim();

                // Validate
                if (newPassword.length < 6) {
                    showToast('Password must be at least 6 characters', 'error');
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showToast('Passwords do not match', 'error');
                    return;
                }

                // Show loading
                resetBtn.classList.add('loading');
                resetBtn.disabled = true;

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            token: token,
                            password: newPassword
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        showToast('✅ ' + data.message, 'success');

                        messageContainer.innerHTML = `
                            <div class="success-message">
                                <i class="fas fa-check-circle"></i> ${data.message}
                                <br><small>Redirecting to login...</small>
                            </div>
                        `;

                        resetBtn.disabled = true;

                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 3000);

                    } else {
                        showToast('❌ ' + data.message, 'error');
                    }

                } catch (error) {
                    showToast('❌ Network Error: ' + error.message, 'error');
                }

                resetBtn.classList.remove('loading');
                resetBtn.disabled = false;
            });

        });
    </script>

</body>
</html>
