<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · Lost & Found Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background-image: url(WhatsApp\ Image\ 2026-07-02\ at\ 3.31.44\ PM.jpeg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-wrapper {
            max-width: 420px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.70);
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(12, 68, 124, 0.08);
            padding: 2rem 2rem 2.2rem;
            transition: all 0.2s;
        }

        .form-header {
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.6rem;
        }

        .logo-wrapper .logo-img {
            max-height: 100px;
            width: 100px;
            height: 100px;
            display: block;
            border-radius: 50%;
            object-fit: cover;
            background: transparent;
            box-shadow: 0 6px 20px rgba(24, 95, 165, 0.18);
            transition: transform 0.2s;
            border: none;
        }

        .logo-wrapper .logo-img:hover {
            transform: scale(1.05);
        }

        .form-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1eb793;
            margin-top: 0.2rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .input-group label {
            font-size: 0.78rem;
            font-weight: 600;
            color: #2C2C2A;
        }
        .input-field {
            position: relative;
            display: flex;
            align-items: center;
            background: #F1EFE8;
            border: 1.5px solid #B5D4F4;
            border-radius: 60px;
            padding: 0 1rem;
            transition: 0.2s;
        }
        .input-field:focus-within {
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.10);
            background: white;
        }
        .input-field i {
            color: #5F5E5A;
            font-size: 0.8rem;
            margin-right: 0.5rem;
            width: 1rem;
            text-align: center;
        }
        .input-field input {
            border: none;
            background: transparent;
            padding: 0.6rem 0;
            width: 100%;
            font-size: 0.9rem;
            outline: none;
            color: #2C2C2A;
        }
        .input-field input::placeholder {
            color: #afafa2;
            font-size: 0.82rem;
        }
        .input-field .toggle-pw {
            cursor: pointer;
            color: #5F5E5A;
            font-size: 0.8rem;
            padding: 0.2rem;
            transition: color 0.2s;
        }
        .input-field .toggle-pw:hover {
            color: #185FA5;
        }

        .input-field.error {
            border-color: #E24B4A;
            background: #fff6f5;
        }
        .input-field.error:focus-within {
            box-shadow: 0 0 0 3px rgba(226, 75, 74, 0.12);
        }
        .error-message {
            color: #E24B4A;
            font-size: 0.7rem;
            padding-left: 1rem;
            min-height: 0.9rem;
            margin-top: 0.05rem;
        }

        .success-message {
            color: #0d9488;
            font-size: 0.85rem;
            text-align: center;
            padding: 8px;
            background: #e6f7f5;
            border-radius: 8px;
            margin: 5px 0;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            margin: 0.05rem 0 0.1rem;
        }
        .form-options label {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: #2C2C2A;
            cursor: pointer;
        }
        .form-options label input[type="checkbox"] {
            accent-color: #185FA5;
            width: 0.85rem;
            height: 0.85rem;
            margin: 0;
        }
        .form-options a {
            color: #0d9488;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.78rem;
        }
        .form-options a:hover {
            text-decoration: underline;
            color: #0C447C;
        }

        .btn-login {
            background: #0d9488;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 0.65rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            height: 42px;
            margin-top: 0.1rem;
        }
        .btn-login:hover {
            background: #0a7a70;
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .btn-login .spinner {
            display: none;
            width: 0.95rem;
            height: 0.95rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .btn-login.loading .spinner {
            display: inline-block;
        }
        .btn-login.loading .btn-text {
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: #5F5E5A;
            font-size: 0.7rem;
            margin: 0.1rem 0;
        }
        .divider hr {
            flex: 1;
            border: none;
            border-top: 1px solid #B5D4F4;
        }

        .register-cta {
            text-align: center;
            font-size: 0.82rem;
            color: #2C2C2A;
        }
        .register-cta a {
            color: #0d9488;
            font-weight: 600;
            text-decoration: none;
        }
        .register-cta a:hover {
            text-decoration: underline;
        }

        .captcha-note {
            font-size: 0.6rem;
            color: #5F5E5A;
            text-align: center;
            margin-top: 0.1rem;
            opacity: 0.7;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transform: translateX(120%);
            transition: transform 0.4s ease;
            max-width: 350px;
        }
        .toast.show {
            transform: translateX(0);
        }
        .toast.success {
            background: #0d9488;
        }
        .toast.error {
            background: #E24B4A;
        }

        @media (max-width: 700px) {
            .login-wrapper {
                padding: 1.5rem 1.2rem 1.5rem;
                max-width: 380px;
            }
            .form-options {
                flex-wrap: wrap;
                gap: 0.2rem;
            }
            .form-header h2 {
                font-size: 1.3rem;
            }
            .logo-wrapper .logo-img {
                width: 80px;
                height: 80px;
                max-height: 80px;
            }
        }

        @media (max-width: 480px) {
            .login-wrapper {
                padding: 1.2rem 1rem 1.5rem;
                border-radius: 18px;
            }
            .logo-wrapper .logo-img {
                width: 70px;
                height: 70px;
                max-height: 70px;
            }
            .form-header h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="login-wrapper">
        <div class="form-header">
            <div class="logo-wrapper">
                <img src="cropped_circle_image.png" alt="Lost & Found Logo" class="logo-img" />
            </div>
            <h2 style="color: #1eb793;">Welcome back!</h2>
        </div>

        <form class="login-form" id="loginForm" novalidate autocomplete="off">
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-field" id="emailField">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter your email" autofocus required />
                </div>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-field" id="passwordField">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required />
                    <span class="toggle-pw" id="togglePw"><i class="fas fa-eye"></i></span>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div id="loginMessage"></div>

            <div class="form-options">
                <label>
                    <input type="checkbox" id="rememberMe" /> Remember me
                </label>
                <a href="forgotpassword.html" id="forgotLink">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text">Log in <i class="fas fa-arrow-right" style="margin-left: 0.2rem;"></i></span>
                <span class="spinner"></span>
            </button>

            <div class="divider">
                <hr /><span>or</span><hr />
            </div>

            <div class="register-cta">
                Don't have an account? <a href="register.html">Register here</a>
            </div>

            <div class="captcha-note">
                <i class="fas fa-shield"></i> After 5 failed attempts, CAPTCHA will appear
            </div>
        </form>
    </div>

    <script>
    (function() {
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailField = document.getElementById('emailField');
        const passwordField = document.getElementById('passwordField');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const loginBtn = document.getElementById('loginBtn');
        const togglePw = document.getElementById('togglePw');
        const loginMessage = document.getElementById('loginMessage');
        const toast = document.getElementById('toast');

        // Toggle Password
        togglePw.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        // Clear Errors
        emailInput.addEventListener('input', function() {
            clearFieldError(emailField, emailError);
            loginMessage.innerHTML = '';
        });
        passwordInput.addEventListener('input', function() {
            clearFieldError(passwordField, passwordError);
            loginMessage.innerHTML = '';
        });

        function clearFieldError(field, errorEl) {
            field.classList.remove('error');
            errorEl.textContent = '';
        }

        function setFieldError(field, errorEl, message) {
            field.classList.add('error');
            errorEl.textContent = message;
        }

        // Toast Function
        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = 'toast ' + type;
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ============================================================
        // ✅ LOGIN FORM SUBMIT - WITH ROLE-BASED REDIRECTION
        // ============================================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Clear previous errors
            clearFieldError(emailField, emailError);
            clearFieldError(passwordField, passwordError);
            loginMessage.innerHTML = '';

            // ============================================
            // ✅ VALIDATION
            // ============================================
            let isValid = true;
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email) {
                setFieldError(emailField, emailError, 'Email is required.');
                isValid = false;
            } else if (!emailPattern.test(email)) {
                setFieldError(emailField, emailError, 'Please enter a valid email address.');
                isValid = false;
            }

            if (!password) {
                setFieldError(passwordField, passwordError, 'Password is required.');
                isValid = false;
            } else if (password.length < 6) {
                setFieldError(passwordField, passwordError, 'Password must be at least 6 characters.');
                isValid = false;
            }

            if (!isValid) {
                if (emailField.classList.contains('error')) emailInput.focus();
                else if (passwordField.classList.contains('error')) passwordInput.focus();
                return;
            }

            // ============================================
            // ✅ SHOW LOADING
            // ============================================
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                // ============================================
                // ✅ CALL BACKEND API
                // ============================================
                const API_URL = 'http://localhost/lostandfoundt/backend/api/login.php';                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();
                console.log('📥 Login Response:', data);

                // ============================================
                // ✅ HANDLE RESPONSE
                // ============================================
                if (data.success) {
                    // ✅ Store user info
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // ✅ Store role separately for easy access
                    localStorage.setItem('userRole', data.user.role);

                    // Success message
                    loginMessage.innerHTML = `
                        <div class="success-message">
                            <i class="fas fa-check-circle"></i> Login successful! Redirecting...
                        </div>
                    `;

                    showToast('✅ Login successful!', 'success');

                    // Remember me
                    if (document.getElementById('rememberMe').checked) {
                        localStorage.setItem('rememberEmail', email);
                    } else {
                        localStorage.removeItem('rememberEmail');
                    }

                    // ============================================
                    // ✅ REDIRECT BASED ON ROLE - ONLY 3 ROLES!
                    // ============================================
                    setTimeout(() => {
                        const userRole = data.user.role || 'Student';
                        console.log('🔄 Redirecting with role:', userRole);
                        
                        // Convert to lowercase for case-insensitive comparison
                        const roleLower = userRole.toLowerCase().trim();
                        console.log('🔄 Role (lowercase):', roleLower);
                        
                        // ✅ ONLY 3 ROLES: Student, Manager, Admin
                        if (roleLower === 'admin') {
                            console.log('➡️ Redirecting to Admin home page] ');
                            window.location.href = '../pub/home.html';
                        } 
                        else if (roleLower === 'manager') {
                            console.log('➡️ Redirecting to Manager home page');
                            window.location.href = '../pub/home.html';
                        } 
                        else {
                            // Student or any other role
                            console.log('➡️ Redirecting to Student home page');
                            window.location.href = '../pub/home.html';
                        }
                    }, 1500);

                } else {
                    // ❌ Login failed
                    setFieldError(emailField, emailError, data.message || 'Invalid credentials');
                    passwordField.classList.add('error');
                    passwordError.textContent = 'Please check your password.';
                    
                    showToast('❌ ' + (data.message || 'Login failed'), 'error');

                    // Failed attempt count
                    let attempts = parseInt(sessionStorage.getItem('loginAttempt') || '0') + 1;
                    sessionStorage.setItem('loginAttempt', attempts);
                    
                    if (attempts >= 5) {
                        showToast('⚠️ Too many failed attempts. CAPTCHA required.', 'error');
                        sessionStorage.setItem('loginAttempt', '0');
                    }
                }

            } catch (error) {
                // ❌ Network Error
                console.error('❌ Network Error:', error);
                loginMessage.innerHTML = `
                    <div class="error-message" style="text-align:center; padding:10px;">
                        <i class="fas fa-wifi"></i> Network Error! Check your connection.
                        <br><small style="color:#999;">${error.message}</small>
                    </div>
                `;
                showToast('❌ Network Error: ' + error.message, 'error');
            }

            // ============================================
            // ✅ REMOVE LOADING
            // ============================================
            loginBtn.classList.remove('loading');
            loginBtn.disabled = false;
        });

        // ============================================
        // ✅ REMEMBER ME
        // ============================================
        window.addEventListener('load', function() {
            const rememberEmail = localStorage.getItem('rememberEmail');
            if (rememberEmail) {
                emailInput.value = rememberEmail;
                document.getElementById('rememberMe').checked = true;
            }
            emailInput.focus();
        });

    })();
    </script>

</body>
</html>
